<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云端书签</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="popup.nav.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h2>云端书签</h2>
      <div class="header-right">
        <div class="scene-switcher">
          <button id="sceneSwitchBtn" class="scene-switch-btn" title="切换场景">
            <span id="currentSceneName">家庭</span>
            <span class="scene-arrow">▼</span>
          </button>
          <div id="sceneMenu" class="scene-menu" style="display: none;">
            <!-- 场景列表将动态生成 -->
          </div>
        </div>
        <div class="sync-status" id="syncStatus">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">同步中</span>
        </div>
        <button id="favoriteDrawerToggle" class="header-icon-btn" title="查看收藏书签">
          <span class="header-icon-btn-inner">
            <span class="icon-star-drawer">★</span>
          </span>
        </button>
        <button id="folderDrawerToggle" class="header-icon-btn" title="打开目录导航">
          <span class="header-icon-btn-inner">
            <span class="icon-folder-drawer"></span>
          </span>
        </button>
      </div>
    </header>

    <!-- 当前文件夹粘性条：固定在列表区域顶部（搜索/快捷操作之上） -->
    <div id="currentFolderSticky" class="current-folder-sticky" style="display: none;">
      <div class="current-folder-inner">
        <span class="current-folder-icon">📁</span>
        <span class="current-folder-label">当前文件夹</span>
        <span class="current-folder-path" id="currentFolderPathText"></span>
      </div>
    </div>

    <div class="popup-content">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索书签...">
        <button id="searchClearBtn" class="search-clear-btn" title="清除搜索" style="display: none;">✕</button>
      </div>

      <div class="quick-actions">
        <button id="addCurrentBtn" class="action-btn primary-action">
          <span class="icon icon-plus">+</span>
          <div class="action-text">
            <div class="action-title">添加当前页面</div>
            <div class="action-subtitle">一键保存到云端</div>
          </div>
        </button>
        <button id="openFullBtn" class="action-btn secondary-action">
          <span class="icon icon-book">📚</span>
          <div class="action-text">
            <div class="action-title">打开书签管理</div>
            <div class="action-subtitle">查看与整理书签</div>
          </div>
        </button>
      </div>

      <div class="recent-bookmarks" id="recentBookmarks">
        <h3>书签列表</h3>
        <!-- 列表区域加载遮罩 -->
        <div id="popupLoadingOverlay" class="popup-loading-overlay" style="display: none;">
          <div class="popup-loading-spinner"></div>
          <div class="popup-loading-text">书签加载中…</div>
        </div>
        <div id="bookmarkList" class="bookmark-list">
          <div class="empty-state">暂无书签</div>
        </div>
      </div>
    </div>
    
    <button id="backToTopBtn" class="back-to-top" title="回到顶部">↑</button>

    <!-- 抽屉式目录导航 -->
    <div id="folderDrawer" class="folder-drawer-overlay" style="display: none;">
      <div class="folder-drawer-mask"></div>
      <div class="folder-drawer-panel">
        <div class="folder-drawer-header">
          <div class="folder-drawer-title">目录导航</div>
          <button id="folderDrawerBack" class="folder-drawer-back" title="返回上一级" style="display: none;">←</button>
          <div class="folder-drawer-mode" id="folderDrawerModeLabel">树形目录</div>
          <button id="folderDrawerClose" class="folder-drawer-close" title="关闭目录">✕</button>
        </div>
        <div class="folder-drawer-body">
          <div id="folderDrawerTabs" class="folder-drawer-tabs" data-mode="tabs" style="display: none;">
            <!-- 横向标签目录内容由脚本动态渲染 -->
          </div>
          <div id="folderDrawerTree" class="folder-drawer-tree" data-mode="tree">
            <!-- 树形/子目录内容由脚本动态渲染 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 收藏书签抽屉 -->
    <div id="favoriteDrawer" class="folder-drawer-overlay" style="display: none;">
      <div class="folder-drawer-mask"></div>
      <div class="folder-drawer-panel favorite-drawer-panel">
        <div class="folder-drawer-header">
          <div class="folder-drawer-title">收藏书签</div>
          <button id="favoriteDrawerClose" class="folder-drawer-close" title="关闭收藏">✕</button>
        </div>
        <div class="favorite-drawer-body">
          <div id="favoriteDrawerList" class="favorite-drawer-list">
            <!-- 收藏内容由脚本动态渲染 -->
          </div>
        </div>
      </div>
    </div>

    <footer class="popup-footer">
      <div class="footer-actions">
        <button id="exportLogBtn" class="footer-btn">导出日志</button>
        <button id="settingsBtn" class="footer-btn">设置</button>
      </div>
    </footer>
  </div>

  <!-- 自定义确认对话框 -->
  <div id="confirmDialog" class="confirm-dialog-overlay" style="display: none;">
    <div class="confirm-dialog">
      <div class="confirm-dialog-header">
        <h3>确认删除</h3>
      </div>
      <div class="confirm-dialog-body">
        <p id="confirmDialogMessage">确定要删除这个书签吗？</p>
      </div>
      <div class="confirm-dialog-footer">
        <button id="confirmDialogCancel" class="confirm-dialog-btn cancel-btn">取消</button>
        <button id="confirmDialogConfirm" class="confirm-dialog-btn confirm-btn">确定</button>
      </div>
    </div>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="../utils/utils.js"></script>
  <script src="popup.js"></script>
  <script src="popup.folderNav.js"></script>
</body>
</html>
